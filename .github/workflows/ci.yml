name: CI

on:
  push:
    branches: ['**']
  pull_request:

# A new push supersedes an in-flight run on the same ref. Without this a busy
# branch queues builds that are already irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Never a bare major. package.json pins engines.node to an exact
          # patch and .npmrc sets engine-strict, so a floating 22.x resolves to
          # whatever the runner ships and `npm ci` dies with EBADENGINE before
          # installing anything.
          node-version-file: .nvmrc
          cache: npm

      # --include=dev because CI may set NODE_ENV=production, which would skip
      # devDependencies and break `next build` (no typescript).
      # --include=optional for the platform-specific @tailwindcss/oxide and
      # @next/swc binaries.
      - run: npm ci --include=dev --include=optional

      # THE step that makes CI possible at all. amplify_outputs.json is
      # gitignored and a static import, so without a placeholder every
      # subsequent step fails with "Can't resolve '@/../amplify_outputs.json'"
      # before compiling a line. CI has no AWS account and needs none.
      - name: Write placeholder Amplify outputs
        run: npm run ci:outputs

      # Regenerates the fixture from amplify/data/resource.ts and fails if it
      # differs from the committed one — a schema change that was not synced is
      # caught here rather than as a mysteriously stale client shape.
      - name: Check the CI fixture matches the schema
        run: npm run ci:outputs:check

      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck:all
      - run: npm run test
      - run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: End-to-end
        run: npx playwright test
        env:
          # The suite deliberately runs against the unreachable placeholder
          # backend, so the degraded-path assertions are real.
          E2E_PORT: '3000'

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
